when:
  - condition: flag(prod)
    then:
      ghc-options:
        - -fdicts-strict
        - -fplugin Fusion.Plugin
        - -fmax-worker-args=16
        - -fspec-constr-recursive=16
        - -fplugin-opt=Fusion.Plugin:verbose=1
        #- -fplugin-opt=Fusion.Plugin:dump-core
        - -O2
    else:
      ghc-options:
        - -fdicts-strict
        - -O1

      
library:
  source-dirs: src
  install-includes: src/Chopaan/Node/UpdateInst.inc

executables:
  server:
    main:                Server.hs
    other-modules: []
    source-dirs:         app
    when:
      condition: "impl(ghcjs)"
      then:
        buildable: false
      else:
        dependencies:
          - chopaan
          - optparse-simple
          - base
        other-modules:
          - Paths_chopaan
        when:
          - condition: flag(prod)
            then:
              ghc-options:
                #- -fplugin=ConCat.Plugin
                - -fdicts-strict
                #- -fplugin Fusion.Plugin
                - -O2
                - -with-rtsopts=-N
                - -threaded 
            else:
              ghc-options:
                - -fdicts-strict
                - -O1
                - -threaded 
  # dev:
  #   main:             Dev.hs
  #   other-modules:
  #     - Paths_chopaan
  #   source-dirs:         app
  #   when:
  #     condition: "impl(ghcjs)"
  #     then:
  #       buildable: false
  #     else:
  #       dependencies:
