executables:
  server:
    main:                Server.hs
    other-modules: []
    source-dirs:         app
    when:
      condition: "impl(ghcjs)"
      then:
        buildable: false
      else:
        dependencies:
          - chopaan
          - optparse-simple
          - base
        other-modules:
          - Paths_chopaan
        ghc-options:
          - -threaded
          - -O2
          - -fdicts-strict
          - -fmax-worker-args=16
          - -fspec-constr-recursive=16
          #- -fplugin Fusion.Plugin          
  dev:
    main:             Dev.hs
    other-modules: []
    source-dirs:         app
    when:
      condition: "impl(ghcjs)"
      then:
        buildable: false
      else:
        dependencies:
          - chopaan
          - optparse-simple
          - base
        ghc-options:
          - -threaded
          - -O2
  ui:
    main:                Ui.hs
    other-modules: []
    source-dirs:         app
    when:
      condition: "!impl(ghcjs)"
      then:
        buildable: true
        dependencies:
          - chopaan
          - optparse-simple
          - base
        ghc-options:
          - -threaded
          - -O2
          #- -fplugin=ConCat.Plugin
      else:
        buildable: true
        dependencies:
          - chopaan
          - optparse-simple
          - base
        ghc-options:
          - -threaded
          - -O2
  kbtzim:
    main:                Main.hs
    other-modules:
      - Paths_chopaan
    source-dirs:         app
    when:
      condition: "!impl(ghcjs)"
      then:
        buildable: true
        dependencies:
          - chopaan
          - optparse-simple
          - base
        ghc-options:
          - -threaded
          - -O2
          - -fdicts-strict
          - -fmax-worker-args=16
          - -fspec-constr-recursive=16
          #- -fplugin Fusion.Plugin          
      else:
        buildable: false
  # hydrate:
  #   main:                Hydrate.hs
  #   other-modules: []
  #   source-dirs:         app
  #   when:
  #     condition: "!impl(ghcjs)"
  #     then:
  #       buildable: true
  #       dependencies:
  #         - chopaan
  #         - optparse-simple
  #         - base
  #       ghc-options:
  #         - -threaded
  #         - -O2
  #     else:
  #       buildable: false


tests:
  chopaan-test:
    main:                Spec.hs
    source-dirs:         test
    when:
      condition: "impl(ghcjs)"
      then:
        dependencies:
          base
        buildable: false
      else:
        dependencies:
          - chopaan
          - hspec
          - QuickCheck
          - checkers
          - quickspec
          - quickcheck-instances
          - generic-arbitrary
          - proto-lens-arbitrary
          - proto-lens-arbitrary
          - hspec-golden-aeson
          - hspec-wai
        ghc-options:
          - -threaded
          - -with-rtsopts=-N
          - -O2
        build-tools:
          hspec-discover:hspec-discover
