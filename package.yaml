- diagrams-contrib >= 1.4.4
- SVGFonts
- comonad
- pointed
- interpolatedstring-perl6
- retry
- Shpadoinkle >= 0.3.0.0
- Shpadoinkle-backend-snabbdom
- Shpadoinkle-console
- Shpadoinkle-html
- Shpadoinkle-widgets
- Shpadoinkle-router
- Shpadoinkle-lens
- Shpadoinkle-template
- ghcjs-dom
- servant-client-js
- newtype-generics
- lens
- raw-strings-qq
- jsaddle >= 0.9.7.1
- haxl
- greskell >= 1.2.0.0
- greskell-core >= 0.1.3.5
- clay
- colour
- file-embed
- envy
- compensated
- beam-core
- monad-bayes
- convertible
- regex-applicative
- generic-lens
when:
  condition: "!impl(ghcjs)"
  then:
    dependencies:
      - optparse-applicative
      - net-spider
      - beam-postgres
      - beam-migrate
      - postgresql-simple
      - concat-classes
      - concat-examples
      - concat-plugin
      - concat-graphics
      - network-uri
      - websockets
      - servant-server
      - servant-websockets
      - amazonka
      - amazonka-iot
      - amazonka-s3
      - net-mqtt >= 0.7.0
      - wai
      - warp
      - wai-cors
      - connection
      - conduit
      - tls
      - x509-store
      - x509-validation
      - greskell-websocket >= 0.1.2.5
      - suavemente
      - dhall >= 1.33.0
      - sbv
      - http-client
      - fusion-plugin
      - servant-client
      - blaze-markup
      - servant-blaze
      - servant-js
      - katip
    ghc-options:
      - -fplugin=ConCat.Plugin
      - -fdicts-strict
      - -fmax-worker-args=16
      - -fspec-constr-recursive=16
      #- -fplugin Fusion.Plugin
      - -O2
  else:
    dependencies:
      - ghcjs-base
      
