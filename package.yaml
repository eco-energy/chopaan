  #   other-modules: []
  #   source-dirs:         app
  #   dependencies:
  #     - chopaan
  #     - optparse-simple
  #     - base
  #   ghc-options:
  #     - -threaded
  #     - -O1

  dashgen:
    main:                DashGen.hs
    other-modules: []
    source-dirs:         app
    when:
      condition: "impl(ghcjs)"
      then:
        buildable: false
      else:
        dependencies:
          - grafana
          - optparse-simple
          - text
          - bytestring
          - chopaan
          - base
  kbtzim:
    main:                Main.hs
    other-modules:
      - Paths_chopaan
    source-dirs:         app
    when:
      condition: "!impl(ghcjs)"
      then:
        buildable: true
        dependencies:
          - chopaan
          - optparse-simple
          - base
        when:
          - condition: flag(prod)
            then:
              ghc-options:
                #- -fplugin=ConCat.Plugin
                - -fdicts-strict
                #- -fplugin Fusion.Plugin
                - -O2
                #- -with-rtsopts=-N
                - -with-rtsopts=-N
                - -threaded
                - -rtsopts
                - -eventlog
            else:
              ghc-options:
                - -rtsopts
                - -fdicts-strict
                - -O1
                - -threaded
                - -eventlog
      else:
        buildable: false
  hydrate:
    main:                Hydrate.hs
    other-modules:
      - Paths_chopaan
    source-dirs:         app
    when:
      condition: "!impl(ghcjs)"
      then:
        buildable: true
        dependencies:
          - chopaan
          - optparse-simple
          - base
        when:
          - condition: flag(prod)
            then:
              ghc-options:
                #- -fplugin=ConCat.Plugin
                - -fdicts-strict
                - -fplugin Fusion.Plugin
                - -O2
                - -fmax-worker-args=16
                - -fspec-constr-recursive=16
                #- -with-rtsopts=-N
                - -with-rtsopts=-N
                - -threaded
                - -rtsopts
                - -eventlog
            else:
              ghc-options:
                - -rtsopts
                - -fdicts-strict
                - -O1
                - -threaded
                - -eventlog
      else:
        buildable: false


tests:
  chopaan-test:
    main:                Spec.hs
    source-dirs:         test
    when:
      condition: "impl(ghcjs)"
      then:
        dependencies:
          base
        buildable: false
      else:
        dependencies:
          - chopaan
          - hspec >= 2.8.2
          - QuickCheck
          - checkers
          - quickspec
          - quickcheck-instances
          - generic-arbitrary
          - proto-lens-arbitrary
          - proto-lens-arbitrary
          - hspec-golden-aeson
          - hspec-wai
          - testcontainers
        ghc-options:
          - -threaded
          - -with-rtsopts=-N
        build-tools:
          hspec-discover:hspec-discover

flags:
  prod:
    description: Build for production
    manual: yes
    default: no
