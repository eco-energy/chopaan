- rio >= 0.1.8.0
- streamly >= 0.7.2
- network >= 3.1.2.1
- async
- adjunctions
- exceptions
- deepseq
- ghc-prim
- binary
- unagi-chan
- aeson
- proto-lens
- proto-lens-runtime
- text
- bytestring
- data-default-class
- containers
- unordered-containers
- stm
- time
- time-compat >= 1.9.2.2
- ulid
- filepath
- directory
- microlens
- base64
- mtl
- transformers
- transformers-base
- monad-control
- dependent-sum
- dependent-map
- dependent-sum-template
- constraints-extras
- resourcet
- unliftio
- hashable
- estimator
- cassava
- distributive
- linear
- ad
- keys
- vector
- vector-sized
- dimensional
- retry
- algebraic-graphs >= 0.5
- resource-pool
- servant
- diagrams-lib
