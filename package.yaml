name:                chopaan
version:             0.1.0.0
github:              faezs/chopaan
license:             BSD3
author:              Faez Shakil
maintainer:          faez.shakil@gmail.com
copyright:           2019 Faez Shakil


extra-source-files:
- README.md
- ChangeLog.md
- assets/*.css
- js/*.js
- js/*.html


data-files:
 - options.dhall


# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on Github at <https://github.com/faezs/chopaan#readme>



dependencies:
- base >= 4.11 && < 10
- rio >= 0.1.8.0
- streamly >= 0.7.2
- fusion-plugin
- async
- exceptions
- deepseq
- ghc-prim
- binary
- unagi-chan
- aeson
- proto-lens
- proto-lens-runtime
- text
- bytestring
- data-default-class
- containers
- unordered-containers
- stm
- time
- time-compat >= 1.9.2.2
- ulid
- filepath
- directory
- microlens
- mtl
- transformers
- transformers-base
- monad-control
- typerep-map
- dependent-sum
- dependent-map
- dependent-sum-template
- constraints-extras
- resourcet
- unliftio
- hashable
- estimator
- cassava
- distributive
- linear
- ad
- keys
- vector
- vector-sized
- dimensional
- retry
- algebraic-graphs >= 0.5
- katip
- resource-pool
- monad-bayes
- base64
- servant
- servant-js
- servant-client
- diagrams-lib
- diagrams-svg >= 1.4.3
- diagrams-contrib >= 1.4.4
- SVGFonts
- comonad
- pointed
- interpolatedstring-perl6
- blaze-markup
- servant-blaze
- retry
- Shpadoinkle >= 0.3.0.0
- Shpadoinkle-backend-pardiff
- Shpadoinkle-html
- Shpadoinkle-widgets
- Shpadoinkle-router
- Shpadoinkle-lens
- Shpadoinkle-template
- ghcjs-dom
- servant-client-js
- newtype-generics
- lens
- raw-strings-qq
- jsaddle >= 0.9.7.1
- haxl
- greskell >= 1.2.0.0
- greskell-core >= 0.1.3.5
- clay
- colour
- file-embed
when:
  condition: "!impl(ghcjs)"
  then:
    dependencies:
      - beam-core
      - beam-postgres
      - beam-migrate
      - network >= 3.1.2.1
      - postgresql-simple
      - concat-classes
      - concat-examples
      - concat-plugin
      - concat-graphics
      - network-uri
      - websockets
      - servant-server
      - servant-websockets
      - amazonka
      - amazonka-iot
      - amazonka-s3
      - net-mqtt >= 0.7.0
      - wai
      - warp
      - wai-cors
      - connection
      - conduit
      - tls
      - x509-store
      - x509-validation
      - net-spider
      - greskell-websocket >= 0.1.2.5
      - suavemente
      - compensated
      - convertible
      - dhall >= 1.33.0
      - sbv
      - http-client
    ghc-options:
      - -fplugin=ConCat.Plugin
      - -fdicts-strict
      - -fmax-worker-args=16
      - -fspec-constr-recursive=16
      #- -fplugin Fusion.Plugin
      - -O2
  else:
    dependencies:
     - ghcjs-three


