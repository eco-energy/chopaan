name:                chopaan
version:             0.1.0.0
github:              faezs/chopaan
license:             BSD3
author:              Faez Shakil
maintainer:          faez.shakil@gmail.com
copyright:           2019 Faez Shakil


extra-source-files:
- README.md
- ChangeLog.md

data-files:
  options.dhall

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on Github at <https://github.com/faezs/chopaan#readme>



dependencies:
- base >= 4.11 && < 10
- proto-lens-runtime
- proto-lens-protoc
- rio >= 0.1.8.0
- amazonka
- amazonka-iot
- net-mqtt >= 0.7.0
- aeson
- proto-lens
- text
- bytestring
- connection
- tls
- x509-store
- x509-validation
- data-default-class
- network-uri
- containers
- unordered-containers
- stm
- time
- time-compat >= 1.9.2.2
- ulid
- convertible
- time-lens
- directory
- microlens
- streamly >= 0.7.0 && < 0.7.1
- mtl
- transformers
- hashable
- hmatrix
- estimator
- cassava
- compensated
- distributive
- linear
- ad
- numeric-limits
- dhall >= 1.24.0
- keys
- vector
- vector-sized
- dimensional
- reflex-vty
- reflex
- vty
- algebraic-graphs
- katip
- opaleye
- postgresql-simple
- product-profunctors
- concat-classes
- concat-examples
- concat-plugin
- monad-bayes
- mgenv
- opt-expect
- ghc-prim
- servant-websockets
- base64-bytestring
- wai
- warp
- websockets
- servant-server
- sbv

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wpartial-fields
- -Wredundant-constraints
- -fplugin=ConCat.Plugin
- -O2

library:
  source-dirs: src
build-tools-depends: proto-lens-protoc:proto-lens-protoc


executables:
  chopaan-exe:
    main:                Main.hs
    source-dirs:         app
    dependencies:
    - chopaan
    - optparse-simple
    - base
    other-modules:
    - Paths_chopaan
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
  rts-monitor-exe:
    main:                RTS.hs
    source-dirs:         app
    dependencies:
    - chopaan
    - optparse-simple
    - base
    other-modules:
    - Paths_chopaan
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
  
  chopaan-demo-exe:
    main:                Demo.hs
    source-dirs:         app
    dependencies:
    - chopaan
    - optparse-simple
    - base
    other-modules:
    - Paths_chopaan
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -fplugin=ConCat.Plugin
    - -O2
    
tests:
  chopaan-test:
    main:                Spec.hs
    source-dirs:         test
    dependencies:
    - chopaan
    - hspec
    - QuickCheck
    - checkers
    - proto-lens-arbitrary
    - quickcheck-instances
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    - -fplugin=ConCat.Plugin
    - -O2
